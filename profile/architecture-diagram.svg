<svg width="100%" viewBox="0 0 680 600" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Hermatic partition layout and update cycle</title>
  <desc>Three-stage diagram: shipped image, first boot additions via systemd-repart, and the A/B update cycle with automatic rollback.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#666" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: sans-serif; fill: #1a1a1a; }
      .th  { font-size: 13px; font-weight: 600; fill: #111; }
      .ts  { font-size: 11px; fill: #555; }
      .lsm { font-size: 10px; fill: #888; }
      .ghost-box { opacity: 0.4; fill: none; stroke-dasharray: 3 3; }
      .ghost-text { opacity: 0.35; }
      /* light fills, dark strokes, dark text */
      .p-gray   { fill: #f0f0f2; stroke: #999; }
      .p-purple { fill: #ede8fc; stroke: #7c5cbf; }
      .p-teal   { fill: #e0f4f2; stroke: #2a8a80; }
      .p-amber  { fill: #fdf3e0; stroke: #c08020; }
      .p-green  { fill: #e6f4e0; stroke: #3a8020; }
      .p-coral  { fill: #fdeae6; stroke: #c05030; }
      .p-soft   { fill: #f4f4f6; stroke: #bbb; }
      /* text on colored fills */
      .th-purple { font-size: 13px; font-weight: 600; fill: #4a2d8a; }
      .ts-purple { font-size: 11px; fill: #6a4aaa; }
      .th-teal   { font-size: 13px; font-weight: 600; fill: #1a5a55; }
      .ts-teal   { font-size: 11px; fill: #2a7a72; }
      .th-amber  { font-size: 13px; font-weight: 600; fill: #7a5010; }
      .ts-amber  { font-size: 11px; fill: #9a6a20; }
      .th-green  { font-size: 13px; font-weight: 600; fill: #2a5a10; }
      .ts-green  { font-size: 11px; fill: #3a7a20; }
      .th-coral  { font-size: 13px; font-weight: 600; fill: #8a2a10; }
      .ts-coral  { font-size: 11px; fill: #aa4a30; }
      .th-gray   { font-size: 13px; font-weight: 600; fill: #333; }
      .ts-gray   { font-size: 11px; fill: #666; }
      .div { stroke: #ccc; stroke-width: 0.5; stroke-dasharray: 4 4; }
      .arr { stroke: #888; stroke-width: 1; fill: none; }
      /* legend dots */
      .leg-purple { fill: #7c5cbf; }
      .leg-teal   { fill: #2a8a80; }
      .leg-amber  { fill: #c08020; }
      .leg-green  { fill: #3a8020; }
      .leg-coral  { fill: #c05030; }
    </style>
  </defs>

  <!-- Background -->

  <!-- Column headers -->
  <text class="lsm" x="109" y="18" text-anchor="middle">SHIPPED IMAGE</text>
  <text class="lsm" x="348" y="18" text-anchor="middle">FIRST BOOT — systemd-repart adds</text>
  <text class="lsm" x="564" y="18" text-anchor="middle">UPDATE CYCLE</text>

  <!-- Column dividers -->
  <line class="div" x1="218" y1="26" x2="218" y2="542"/>
  <line class="div" x1="478" y1="26" x2="478" y2="542"/>

  <!-- ═══ COL 1: SHIPPED IMAGE ═══ -->

  <rect class="p-gray" x="30" y="40" width="178" height="46" rx="4" stroke-width="0.5"/>
  <text class="th-gray" x="119" y="57" text-anchor="middle" dominant-baseline="central">ESP</text>
  <text class="ts-gray" x="119" y="75" text-anchor="middle" dominant-baseline="central">systemd-boot + UKI</text>

  <rect class="p-purple" x="30" y="98" width="178" height="46" rx="4" stroke-width="0.5"/>
  <text class="th-purple" x="119" y="115" text-anchor="middle" dominant-baseline="central">/usr/ [A]</text>
  <text class="ts-purple" x="119" y="133" text-anchor="middle" dominant-baseline="central">immutable, verity-protected</text>

  <rect class="p-purple" x="30" y="156" width="178" height="36" rx="4" stroke-width="0.5"/>
  <text class="th-purple" x="119" y="174" text-anchor="middle" dominant-baseline="central">verity [A]</text>

  <rect class="p-purple" x="30" y="204" width="178" height="36" rx="4" stroke-width="0.5"/>
  <text class="th-purple" x="119" y="222" text-anchor="middle" dominant-baseline="central">PKCS#7 sig [A]</text>

  <text class="lsm" x="119" y="256" text-anchor="middle">2 partitions · dd to disk</text>

  <!-- ═══ COL 2: FIRST BOOT ═══ -->

  <!-- ghosted originals -->
  <rect class="p-gray ghost-box" x="228" y="40" width="240" height="46" rx="4" stroke-width="0.5"/>
  <rect class="p-purple ghost-box" x="228" y="98" width="240" height="46" rx="4" stroke-width="0.5"/>
  <rect class="p-purple ghost-box" x="228" y="156" width="240" height="36" rx="4" stroke-width="0.5"/>
  <rect class="p-purple ghost-box" x="228" y="204" width="240" height="36" rx="4" stroke-width="0.5"/>

  <!-- ghost text -->
  <text class="th-gray ghost-text" x="348" y="57" text-anchor="middle" dominant-baseline="central">ESP</text>
  <text class="th-purple ghost-text" x="348" y="115" text-anchor="middle" dominant-baseline="central">/usr/ [A]</text>
  <text class="th-purple ghost-text" x="348" y="174" text-anchor="middle" dominant-baseline="central">verity [A]</text>
  <text class="th-purple ghost-text" x="348" y="222" text-anchor="middle" dominant-baseline="central">PKCS#7 sig [A]</text>

  <!-- new partitions -->
  <rect class="p-teal" x="228" y="256" width="240" height="46" rx="4" stroke-width="0.5"/>
  <text class="th-teal" x="348" y="273" text-anchor="middle" dominant-baseline="central">/usr/ [B] — empty</text>
  <text class="ts-teal" x="348" y="291" text-anchor="middle" dominant-baseline="central">awaiting first update</text>

  <rect class="p-teal" x="228" y="314" width="240" height="36" rx="4" stroke-width="0.5"/>
  <text class="th-teal" x="348" y="332" text-anchor="middle" dominant-baseline="central">verity [B] — empty</text>

  <rect class="p-teal" x="228" y="362" width="240" height="36" rx="4" stroke-width="0.5"/>
  <text class="th-teal" x="348" y="380" text-anchor="middle" dominant-baseline="central">PKCS#7 sig [B] — empty</text>

  <rect class="p-amber" x="228" y="410" width="240" height="46" rx="4" stroke-width="0.5"/>
  <text class="th-amber" x="348" y="427" text-anchor="middle" dominant-baseline="central">root fs (LUKS2)</text>
  <text class="ts-amber" x="348" y="445" text-anchor="middle" dominant-baseline="central">TPM2-bound, generated locally</text>

  <rect class="p-amber" x="228" y="468" width="114" height="36" rx="4" stroke-width="0.5"/>
  <text class="th-amber" x="285" y="486" text-anchor="middle" dominant-baseline="central">/home</text>

  <rect class="p-amber" x="354" y="468" width="114" height="36" rx="4" stroke-width="0.5"/>
  <text class="th-amber" x="411" y="486" text-anchor="middle" dominant-baseline="central">swap</text>

  <text class="lsm" x="348" y="518" text-anchor="middle">10 partitions total after first boot</text>

  <!-- ═══ COL 3: UPDATE CYCLE ═══ -->

  <rect class="p-purple" x="488" y="40" width="158" height="46" rx="4" stroke-width="0.5"/>
  <text class="th-purple" x="567" y="57" text-anchor="middle" dominant-baseline="central">/usr/ [A] v0.7</text>
  <text class="ts-purple" x="567" y="75" text-anchor="middle" dominant-baseline="central">active boot slot</text>

  <line class="arr" x1="567" y1="88" x2="567" y2="108" marker-end="url(#arrow)"/>

  <rect class="p-teal" x="488" y="110" width="158" height="46" rx="4" stroke-width="0.5"/>
  <text class="th-teal" x="567" y="127" text-anchor="middle" dominant-baseline="central">/usr/ [B] v0.8</text>
  <text class="ts-teal" x="567" y="145" text-anchor="middle" dominant-baseline="central">staged, signed, verified</text>

  <line class="arr" x1="567" y1="158" x2="567" y2="178" marker-end="url(#arrow)"/>

  <rect class="p-soft" x="488" y="180" width="158" height="46" rx="4" stroke-width="0.5"/>
  <text class="th-gray" x="567" y="197" text-anchor="middle" dominant-baseline="central">boot [B]</text>
  <text class="ts-gray" x="567" y="215" text-anchor="middle" dominant-baseline="central">counter decrements</text>

  <!-- fork -->
  <line class="arr" x1="539" y1="228" x2="519" y2="256" marker-end="url(#arrow)"/>
  <line class="arr" x1="595" y1="228" x2="615" y2="256" marker-end="url(#arrow)"/>
  <text class="lsm" x="508" y="248" text-anchor="middle">✓ ok</text>
  <text class="lsm" x="626" y="248" text-anchor="middle">✗ fail</text>

  <rect class="p-green" x="488" y="258" width="72" height="52" rx="4" stroke-width="0.5"/>
  <text class="th-green" x="524" y="278" text-anchor="middle" dominant-baseline="central">B good</text>
  <text class="ts-green" x="524" y="296" text-anchor="middle" dominant-baseline="central">A wiped</text>

  <rect class="p-coral" x="574" y="258" width="72" height="52" rx="4" stroke-width="0.5"/>
  <text class="th-coral" x="610" y="278" text-anchor="middle" dominant-baseline="central">rollback</text>
  <text class="ts-coral" x="610" y="296" text-anchor="middle" dominant-baseline="central">boot [A]</text>

  <!-- factory reset -->
  <line x1="567" y1="314" x2="567" y2="332" stroke="#ccc" stroke-width="0.5" stroke-dasharray="3 3"/>
  <rect class="p-soft" x="488" y="334" width="158" height="62" rx="4" stroke-width="0.5"/>
  <text class="th-gray" x="567" y="354" text-anchor="middle" dominant-baseline="central">factory reset</text>
  <text class="ts-gray" x="567" y="372" text-anchor="middle" dominant-baseline="central">erase root, home, swap</text>
  <text class="ts-gray" x="567" y="388" text-anchor="middle" dominant-baseline="central">first boot repeats</text>

  <!-- ═══ LEGEND ═══ -->
  <line x1="30" y1="542" x2="650" y2="542" stroke="#e0e0e0" stroke-width="0.5"/>

  <rect class="leg-purple" x="30" y="556" width="10" height="10" rx="2"/>
  <text class="ts" x="46" y="566">immutable /usr/</text>

  <rect class="leg-teal" x="178" y="556" width="10" height="10" rx="2"/>
  <text class="ts" x="194" y="566">update slot [B]</text>

  <rect class="leg-amber" x="318" y="556" width="10" height="10" rx="2"/>
  <text class="ts" x="334" y="566">encrypted writable</text>

  <rect class="leg-green" x="468" y="556" width="10" height="10" rx="2"/>
  <text class="ts" x="484" y="566">good boot</text>

  <rect class="leg-coral" x="564" y="556" width="10" height="10" rx="2"/>
  <text class="ts" x="580" y="566">rollback</text>

</svg>
